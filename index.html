<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Physics X 95 is a zero-build, offline-first history-of-physics lab inspired by Paul Halpern's writing, with sourced stories, classroom pathways, a timeline, and interactive physics exhibits.">
  <meta name="theme-color" content="#254f4a">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta property="og:title" content="Physics X 95 — History Lab">
  <meta property="og:description" content="People, arguments, experiments: a source-aware multimedia history-of-physics lab.">
  <meta property="og:type" content="website">
  <title>Physics X 95 — History Lab</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to the current topic</a>

  <div class="program-shell" id="programShell">
    <header class="program-header">
      <div class="title-bar">
        <div class="program-identity">
          <img src="assets/icon.svg" width="26" height="26" alt="">
          <strong>Physics X 95</strong>
          <span>History Lab</span>
        </div>
        <div class="window-controls" aria-hidden="true">
          <span>_</span><span>□</span><span>×</span>
        </div>
      </div>

      <nav class="menu-bar" aria-label="Program menu">
        <button type="button" data-route="home"><u>F</u>ile</button>
        <button type="button" data-route="stories"><u>S</u>tories</button>
        <button type="button" data-route="timeline"><u>T</u>imeline</button>
        <button type="button" data-route="atlas"><u>E</u>xperiments</button>
        <button type="button" data-route="lessons"><u>C</u>lassroom</button>
        <button type="button" data-route="sources"><u>R</u>eferences</button>
        <button type="button" data-route="about"><u>H</u>elp</button>
      </nav>

      <div class="tool-bar" aria-label="Navigation and document tools">
        <div class="tool-group">
          <button id="backButton" class="tool-button" type="button" aria-label="Go back"><span aria-hidden="true">◀</span><small>Back</small></button>
          <button id="forwardButton" class="tool-button" type="button" aria-label="Go forward"><span aria-hidden="true">▶</span><small>Forward</small></button>
          <button class="tool-button" type="button" data-route="home"><span aria-hidden="true">⌂</span><small>Home</small></button>
        </div>
        <div class="tool-group">
          <button id="searchButton" class="tool-button" type="button"><span aria-hidden="true">⌕</span><small>Find</small></button>
          <button id="bookmarkButton" class="tool-button" type="button" aria-pressed="false"><span aria-hidden="true">☆</span><small>Bookmark</small></button>
          <button id="studyButton" class="tool-button" type="button" aria-pressed="false"><span aria-hidden="true">✓</span><small>Studied</small></button>
        </div>
        <div class="tool-group tool-group-right">
          <button id="teacherButton" class="tool-button" type="button" aria-pressed="false"><span aria-hidden="true">▤</span><small>Teacher</small></button>
          <button id="themeButton" class="tool-button" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><small>Theme</small></button>
          <button id="printButton" class="tool-button" type="button"><span aria-hidden="true">▣</span><small>Print</small></button>
        </div>
      </div>
    </header>

    <div class="program-body">
      <aside class="explorer-pane" aria-label="History lab explorer">
        <div class="pane-title"><span>Explorer</span><span aria-hidden="true">×</span></div>
        <form id="quickSearchForm" class="quick-search" role="search">
          <label for="quickSearch">Find a person or idea</label>
          <div>
            <input id="quickSearch" name="q" type="search" autocomplete="off" placeholder="Boltzmann, Solvay…">
            <button type="submit" aria-label="Search">Go</button>
          </div>
        </form>

        <div class="explorer-tabs" role="tablist" aria-label="Explorer views">
          <button id="contentsTab" type="button" role="tab" aria-selected="true" aria-controls="contentsPanel">Contents</button>
          <button id="favoritesTab" type="button" role="tab" aria-selected="false" aria-controls="favoritesPanel">Favourites</button>
        </div>

        <section id="contentsPanel" class="explorer-panel" role="tabpanel" aria-labelledby="contentsTab">
          <nav id="contentsTree" class="contents-tree" aria-label="Lab contents"></nav>
        </section>
        <section id="favoritesPanel" class="explorer-panel" role="tabpanel" aria-labelledby="favoritesTab" hidden>
          <div id="favoritesList" class="favourites-list"></div>
        </section>

        <div class="disc-label" aria-label="Edition information">
          <span class="disc-icon" aria-hidden="true">◉</span>
          <span><strong>Disc 1</strong><small>Arguments That Made Reality</small></span>
        </div>
      </aside>

      <main id="workspace" class="workspace" tabindex="-1">
        <noscript>
          <article class="document-window">
            <h1>JavaScript is required for the interactive edition.</h1>
            <p>The reference list and project description remain available in the repository README.</p>
          </article>
        </noscript>
      </main>
    </div>

    <footer class="status-bar">
      <span id="statusMessage" role="status" aria-live="polite">Ready</span>
      <span id="routeStatus">Home</span>
      <span id="progressStatus">0 topics studied</span>
      <span id="networkStatus">Local-first</span>
    </footer>
  </div>

  <dialog id="searchDialog" class="search-dialog" aria-labelledby="searchDialogTitle">
    <form method="dialog" class="dialog-title-bar">
      <strong id="searchDialogTitle">Find in Physics X 95</strong>
      <button value="cancel" aria-label="Close search">×</button>
    </form>
    <div class="dialog-body">
      <label for="globalSearch">Search stories, people, glossary, pathways, timeline, and exhibits</label>
      <input id="globalSearch" type="search" autocomplete="off" placeholder="Type two or more characters…">
      <div id="searchResults" class="search-results" aria-live="polite"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/content.js"></script>
  <script src="js/math.js"></script>
  <script src="js/atlas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
