<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics X Lab – Historical Figures</title>
  <meta name="description" content="Interactive lab of historical physicists and the debates that shaped reality. Tailored in the spirit of Paul Halpern’s work.">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand">
        <h1>Physics X Lab</h1>
        <span class="subtitle">Ask me anything about the people who shaped physics</span>
      </div>
      <nav id="main-nav">
        <button data-view="home">Home</button>
        <button data-view="articles">Articles</button>
        <button data-view="exhibits">Exhibits</button>
        <button data-view="pathways">Pathways</button>
        <button data-view="glossary">Glossary</button>
      </nav>
      <input type="search" id="search" placeholder="Search people, debates, quotes…">
    </header>

    <div class="layout">
      <aside id="explorer"></aside>
      <main id="content"></main>
    </div>

    <div id="exhibit-overlay" class="hidden">
      <div class="exhibit-header">
        <h2 id="exhibit-title"></h2>
        <button id="close-exhibit">✕ Close</button>
      </div>
      <canvas id="exhibit-canvas" width="800" height="500"></canvas>
      <div id="exhibit-controls"></div>
      <p id="exhibit-caption"></p>
    </div>
  </div>

  <script src="js/math.js"></script>
  <script src="js/content.js"></script>
  <script src="js/atlas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
